<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Merchant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10192B; --bg:#F6F7F9; --surface:#FFFFFF; --border:#E3E6EA; --muted:#5B6472;
    --brand:#0B6E4F; --brand-dark:#09593F; --brand-tint:#E6F2ED;
    --danger:#B3261E; --danger-tint:#FBEAE9; --warn:#C78A1E; --warn-tint:#FBF1DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:3rem;}
  h1,h2{font-family:'Space Grotesk',sans-serif; margin:0;}
  a{color:inherit;}
  .hidden{display:none !important;}

  header{background:var(--surface); border-bottom:1px solid var(--border); padding:1.1rem 1.25rem; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:0.55rem; text-decoration:none;}
  .brand-mark{width:11px; height:11px; border-radius:3px; background:var(--brand); display:inline-block;}
  header h1{font-weight:700; font-size:1.25rem;}
  #merchantBadge{font-size:0.82rem; color:var(--muted); font-weight:500;}

  main{max-width:480px; margin:0 auto; padding:1.25rem;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1rem;}
  .panel h2{font-size:1.05rem; font-weight:600; margin-bottom:0.8rem;}

  .field{margin-top:0.9rem;}
  .field label{display:block; font-size:0.8rem; color:var(--muted); font-weight:500; margin-bottom:0.3rem;}
  input, select{width:100%; padding:0.65rem 0.75rem; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-family:'Inter'; font-size:0.95rem;}
  input:focus, select:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }

  .btn{display:inline-flex; align-items:center; justify-content:center; font-family:'Inter'; font-weight:600; font-size:0.9rem; padding:0.7rem 1rem; border-radius:8px; border:none; cursor:pointer;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-block{width:100%; margin-top:1rem;}

  .tabs{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; margin-bottom:1rem;}
  .tab{flex:1; text-align:center; padding:0.55rem; border-radius:7px; font-size:0.85rem; font-weight:500; color:var(--muted); background:transparent; border:none; font-family:'Inter'; cursor:pointer;}
  .tab.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(16,25,43,0.08);}

  .msg{font-size:0.85rem; padding:0.55rem 0.75rem; border-radius:8px; margin-top:0.7rem;}
  .msg.error{background:var(--danger-tint); color:var(--danger); border:1px solid rgba(179,38,30,0.2);}
  .msg.ok{background:var(--brand-tint); color:var(--brand); border:1px solid rgba(11,110,79,0.2);}

  .status-badge{display:inline-block; font-size:0.72rem; font-weight:600; padding:0.22rem 0.6rem; border-radius:999px;}
  .status-approved{background:var(--brand-tint); color:var(--brand);}
  .status-pending{background:var(--warn-tint); color:var(--warn);}
  .status-rejected, .status-suspended{background:var(--danger-tint); color:var(--danger);}

  .balance-block{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin-bottom:1rem;}
  .balance-block .label{font-size:0.8rem; color:var(--muted); font-weight:500;}
  .balance-block .amount{font-variant-numeric:tabular-nums; font-size:2rem; font-weight:700; margin-top:0.3rem;}
  .balance-block .amount .unit{font-size:0.8rem; color:var(--muted); font-weight:500; margin-left:0.3rem;}

  .activity-row{display:flex; justify-content:space-between; align-items:center; padding:0.65rem 0; border-bottom:1px solid var(--border); font-size:0.88rem;}
  .activity-row:last-child{border-bottom:none;}
  .activity-amount{font-variant-numeric:tabular-nums; font-weight:600;}
  .activity-time{font-size:0.72rem; color:var(--muted); margin-top:0.15rem;}

  .chip{display:inline-block; font-size:0.72rem; font-weight:600; padding:0.22rem 0.6rem; border-radius:999px;}
  .chip-settled{background:var(--brand-tint); color:var(--brand);}
  .chip-rejected{background:var(--danger-tint); color:var(--danger);}
  .chip-pending{background:var(--warn-tint); color:var(--warn);}
  .chip-disputed{background:var(--warn-tint); color:#9A5B12;}

  .empty-note{color:var(--muted); font-size:0.85rem; text-align:center; padding:1.2rem 0;}
  .pending-note{font-size:0.82rem; color:var(--muted); line-height:1.5; margin-top:0.6rem;}
</style>
</head>
<body>

<header>
  <a href="/merchant" class="brand"><span class="brand-mark"></span><h1>Ledger — Merchant</h1></a>
  <div id="merchantBadge"></div>
</header>

<main>

  <!-- ===== AUTH ===== -->
  <section id="authScreen" class="panel hidden">
    <h2>Merchant sign-in</h2>
    <div class="tabs">
      <button id="tabLogin" class="tab active" onclick="switchTab('login')">I have an account</button>
      <button id="tabRegister" class="tab" onclick="switchTab('register')">Register business</button>
    </div>

    <div id="loginForm">
      <div class="field">
        <label for="loginEmail">Business email</label>
        <input id="loginEmail" type="email" placeholder="you@business.com">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" onclick="loginExisting()">Sign in</button>
    </div>

    <div id="registerForm" class="hidden">
      <div class="field">
        <label for="regName">Business name</label>
        <input id="regName" placeholder="GreenBasket Stores">
      </div>
      <div class="field">
        <label for="regEmail">Business email</label>
        <input id="regEmail" type="email" placeholder="you@business.com">
      </div>
      <div class="field">
        <label for="regPassword">Password (min. 8 characters)</label>
        <input id="regPassword" type="password" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="regCategory">Category you sell under</label>
        <select id="regCategory">
          <option value="transport">Transport</option>
          <option value="food">Food</option>
          <option value="rent">Rent</option>
          <option value="school_fees">School fees</option>
          <option value="healthcare">Healthcare</option>
          <option value="electricity">Electricity</option>
          <option value="water">Water</option>
          <option value="fuel">Fuel</option>
          <option value="groceries">Groceries</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="registerNew()">Register business</button>
      <p class="pending-note">New businesses start as "pending" until an admin approves them — you can sign in right away and see your status, but can't accept payments until approved.</p>
    </div>

    <div id="authMsg"></div>
  </section>

  <!-- ===== DASHBOARD ===== -->
  <section id="dashScreen" class="hidden">

    <div class="balance-block">
      <div class="label">Settled balance</div>
      <div class="amount" id="balanceAmount">0<span class="unit">SIM</span></div>
    </div>

    <div class="panel">
      <h2 id="bizName">&nbsp;</h2>
      <p style="margin:0.2rem 0 0.6rem; color:var(--muted); font-size:0.85rem;" id="bizCategory"></p>
      <span class="status-badge" id="bizStatus"></span>
    </div>

    <div class="panel">
      <h2>Transactions</h2>
      <div id="txnList"></div>
    </div>

    <button class="btn btn-secondary btn-block" onclick="logout()">Switch account</button>
  </section>

</main>

<script>
const API = "";
let state = { merchant: null };

function $(id){ return document.getElementById(id); }

async function api(path, method="GET", body=null){
  const opts = { method, headers: {"Content-Type":"application/json"}, credentials: "same-origin" };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const err = new Error(data.detail || "Request failed");
    err.detail = data.detail;
    throw err;
  }
  return data;
}

window.addEventListener("DOMContentLoaded", async () => {
  try{
    const merchant = await api("/auth/merchant-me");
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    $("authScreen").classList.remove("hidden");
  }
});

function switchTab(tab){
  $("tabLogin").classList.toggle("active", tab==="login");
  $("tabRegister").classList.toggle("active", tab==="register");
  $("loginForm").classList.toggle("hidden", tab!=="login");
  $("registerForm").classList.toggle("hidden", tab!=="register");
  $("authMsg").innerHTML = "";
}

function showMsg(el, text, type){ el.innerHTML = `<div class="msg ${type}">${text}</div>`; }

async function loginExisting(){
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  if(!email || !password){ showMsg($("authMsg"), "Enter your email and password.", "error"); return; }
  try{
    const merchant = await api("/auth/merchant-login", "POST", {email, password});
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    showMsg($("authMsg"), e.detail || "Incorrect email or password.", "error");
  }
}

async function registerNew(){
  const business_name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  const category = $("regCategory").value;
  if(!business_name || !email || !password){
    showMsg($("authMsg"), "Fill in business name, email and password.", "error");
    return;
  }
  try{
    await api("/merchants/register", "POST", {business_name, email, password, category});
    const merchant = await api("/auth/merchant-login", "POST", {email, password});
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    showMsg($("authMsg"), e.detail || "Could not register. Email may already be in use.", "error");
  }
}

async function logout(){
  try{ await api("/auth/merchant-logout", "POST"); }catch(e){ /* clearing local state regardless */ }
  state.merchant = null;
  $("dashScreen").classList.add("hidden");
  $("merchantBadge").textContent = "";
  $("authScreen").classList.remove("hidden");
  switchTab("login");
}

async function enterDashboard(){
  $("authScreen").classList.add("hidden");
  $("dashScreen").classList.remove("hidden");
  $("merchantBadge").textContent = state.merchant.business_name;
  renderProfile(state.merchant);
  await loadBalance();
  await loadTransactions();
}

function renderProfile(m){
  $("bizName").textContent = m.business_name;
  $("bizCategory").textContent = m.category.replace('_',' ');
  const statusClass = m.is_suspended ? "status-suspended" : `status-${m.status}`;
  const statusText = m.is_suspended ? "suspended" : m.status;
  $("bizStatus").className = `status-badge ${statusClass}`;
  $("bizStatus").textContent = statusText;
}

async function loadBalance(){
  const b = await api(`/merchants/${state.merchant.id}/balance`);
  $("balanceAmount").innerHTML = `${b.settled_balance.toLocaleString()}<span class="unit">SIM</span>`;
}

async function loadTransactions(){
  const txns = await api(`/payments/merchant/${state.merchant.id}`);
  const list = $("txnList");
  if(txns.length === 0){
    list.innerHTML = `<p class="empty-note">No transactions yet.</p>`;
    return;
  }
  list.innerHTML = txns.map(t => `
    <div class="activity-row">
      <div>
        <div class="activity-amount">${t.amount.toLocaleString()} SIM</div>
        <div class="activity-time">${new Date(t.created_at).toLocaleString()}</div>
      </div>
      <span class="chip ${chipClass(t.status)}">${t.status.replace(/_/g,' ')}</span>
    </div>
  `).join("");
}

function chipClass(status){
  if(status === "settled") return "chip-settled";
  if(status.startsWith("rejected") || status.startsWith("failed")) return "chip-rejected";
  if(status === "disputed") return "chip-disputed";
  return "chip-pending";
}
</script>

</body>
</html>
