<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &mdash; Merchant Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2420; --ink-2:#212C26; --ink-3:#2A362F;
    --paper:#EFE7D8; --paper-2:#E6DCC6;
    --moss:#5C7A5E; --moss-dark:#3E5940;
    --oxblood:#8B3A3A; --gold:#C9A227; --inkblue:#2C4A52;
    --text-on-paper:#2A241C; --text-on-ink:#EFE7D8; --text-muted:#9BA89C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{background:var(--ink); color:var(--text-on-ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:3rem;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{padding:1.5rem 1.25rem 1rem; border-bottom:1px solid var(--ink-3); display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:1.5rem;}
  header h1 span{color:var(--gold);}
  #merchantBadge{font-size:0.75rem; color:var(--text-muted); font-family:'IBM Plex Mono',monospace;}
  main{max-width:560px; margin:0 auto; padding:1.25rem;}
  .hidden{display:none !important;}

  .panel{background:var(--ink-2); border:1px solid var(--ink-3); border-radius:6px; padding:1.25rem; margin-bottom:1.25rem;}
  .panel h2{font-size:1.1rem; margin-bottom:0.75rem;}
  label{display:block; font-size:0.8rem; color:var(--text-muted); margin:0.75rem 0 0.3rem;}
  input, select{width:100%; padding:0.65rem 0.7rem; border-radius:4px; border:1px solid var(--ink-3); background:var(--ink); color:var(--text-on-ink); font-family:'Inter',sans-serif; font-size:0.95rem;}
  input:focus, select:focus, button:focus{outline:2px solid var(--gold); outline-offset:1px;}

  button{font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem; padding:0.7rem 1rem; border-radius:4px; border:none; cursor:pointer; margin-top:0.9rem;}
  .btn-primary{background:var(--moss); color:#fff;}
  .btn-primary:hover{background:var(--moss-dark);}
  .btn-secondary{background:transparent; color:var(--text-on-ink); border:1px solid var(--ink-3);}
  .btn-secondary:hover{border-color:var(--gold);}
  .btn-block{width:100%;}

  .tabbar{display:flex; gap:0.4rem; margin-bottom:1rem;}
  .tabbar button{flex:1; margin-top:0; background:var(--ink); color:var(--text-muted); border:1px solid var(--ink-3);}
  .tabbar button.active{background:var(--ink-3); color:var(--text-on-ink); border-color:var(--gold);}

  .msg{font-size:0.85rem; margin-top:0.6rem; padding:0.5rem 0.7rem; border-radius:4px;}
  .msg.error{background:rgba(139,58,58,0.25); color:#E8AFAF; border:1px solid var(--oxblood);}
  .msg.ok{background:rgba(92,122,94,0.25); color:#B9D3BA; border:1px solid var(--moss);}

  /* status badge */
  .status-badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
    text-transform:uppercase; letter-spacing:0.06em; padding:0.25rem 0.55rem;
    border-radius:3px; border:1.5px solid currentColor;
  }
  .status-approved{color:var(--moss);}
  .status-pending{color:var(--gold);}
  .status-rejected, .status-suspended{color:var(--oxblood);}

  .balance-block{background:var(--paper); color:var(--text-on-paper); border-radius:6px; padding:1.3rem; margin-bottom:1.25rem;}
  .balance-block .label{font-size:0.75rem; color:#6B6252; text-transform:uppercase; letter-spacing:0.05em;}
  .balance-block .amount{font-family:'IBM Plex Mono',monospace; font-size:2.1rem; font-weight:600; margin-top:0.3rem;}
  .balance-block .amount .unit{font-size:0.9rem; color:#6B6252; font-weight:400; margin-left:0.3rem;}

  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:0.65rem 0; border-bottom:1px solid var(--ink-3); font-size:0.85rem;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-amount{font-family:'IBM Plex Mono',monospace;}
  .stamp{font-family:'IBM Plex Mono',monospace; font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; padding:0.2rem 0.45rem; border-radius:2px; border:1.5px solid currentColor; transform:rotate(-4deg); display:inline-block;}
  .stamp-settled{color:var(--moss);}
  .stamp-rejected{color:var(--oxblood);}
  .stamp-pending{color:var(--gold);}
  .stamp-disputed{color:#C77F3A;}

  .empty-note{color:var(--text-muted); font-size:0.85rem; text-align:center; padding:1.2rem 0;}
  .pending-note{font-size:0.85rem; color:var(--text-muted); line-height:1.5; margin-top:0.5rem;}
</style>
</head>
<body>

<header>
  <a href="/merchant" style="text-decoration:none; color:inherit;"><h1>Ledger<span>.</span> Merchant</h1></a>
  <div id="merchantBadge"></div>
</header>

<main>

  <!-- ===== AUTH ===== -->
  <section id="authScreen" class="panel hidden">
    <h2>Merchant sign-in</h2>
    <div class="tabbar">
      <button id="tabLogin" class="active" onclick="switchTab('login')">I have an account</button>
      <button id="tabRegister" onclick="switchTab('register')">Register business</button>
    </div>

    <div id="loginForm">
      <label for="loginEmail">Business email</label>
      <input id="loginEmail" type="email" placeholder="you@business.com">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••">
      <button class="btn-primary btn-block" onclick="loginExisting()">Enter</button>
    </div>

    <div id="registerForm" class="hidden">
      <label for="regName">Business name</label>
      <input id="regName" placeholder="GreenBasket Stores">
      <label for="regEmail">Business email</label>
      <input id="regEmail" type="email" placeholder="you@business.com">
      <label for="regPassword">Password (min. 8 characters)</label>
      <input id="regPassword" type="password" placeholder="••••••••">
      <label for="regCategory">Category you sell under</label>
      <select id="regCategory">
        <option value="transport">Transport</option>
        <option value="food">Food</option>
        <option value="rent">Rent</option>
        <option value="school_fees">School fees</option>
        <option value="healthcare">Healthcare</option>
        <option value="electricity">Electricity</option>
        <option value="water">Water</option>
        <option value="fuel">Fuel</option>
        <option value="groceries">Groceries</option>
        <option value="other">Other</option>
      </select>
      <button class="btn-primary btn-block" onclick="registerNew()">Register business</button>
      <p class="pending-note">New businesses start as "pending" until an admin approves them — you'll be able to log in right away and see your status, but can't accept payments until approved.</p>
    </div>

    <div id="authMsg"></div>
  </section>

  <!-- ===== DASHBOARD ===== -->
  <section id="dashScreen" class="hidden">

    <div class="balance-block">
      <div class="label">Settled balance</div>
      <div class="amount" id="balanceAmount">0<span class="unit">SIM</span></div>
    </div>

    <div class="panel">
      <h2 id="bizName">&nbsp;</h2>
      <p style="margin:0.2rem 0 0.6rem; color:var(--text-muted); font-size:0.85rem;" id="bizCategory"></p>
      <span class="status-badge" id="bizStatus"></span>
    </div>

    <div class="panel">
      <h2>Transactions</h2>
      <div id="txnList"></div>
    </div>

    <button class="btn-secondary btn-block" onclick="logout()">Switch account</button>
  </section>

</main>

<script>
const API = "";
let state = { merchant: null };

function $(id){ return document.getElementById(id); }

async function api(path, method="GET", body=null){
  const opts = { method, headers: {"Content-Type":"application/json"}, credentials: "same-origin" };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const err = new Error(data.detail || "Request failed");
    err.detail = data.detail;
    throw err;
  }
  return data;
}

window.addEventListener("DOMContentLoaded", async () => {
  try{
    const merchant = await api("/auth/merchant-me");
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    $("authScreen").classList.remove("hidden");
  }
});

function switchTab(tab){
  $("tabLogin").classList.toggle("active", tab==="login");
  $("tabRegister").classList.toggle("active", tab==="register");
  $("loginForm").classList.toggle("hidden", tab!=="login");
  $("registerForm").classList.toggle("hidden", tab!=="register");
  $("authMsg").innerHTML = "";
}

function showMsg(el, text, type){ el.innerHTML = `<div class="msg ${type}">${text}</div>`; }

async function loginExisting(){
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  if(!email || !password){ showMsg($("authMsg"), "Enter your email and password.", "error"); return; }
  try{
    const merchant = await api("/auth/merchant-login", "POST", {email, password});
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    showMsg($("authMsg"), e.detail || "Incorrect email or password.", "error");
  }
}

async function registerNew(){
  const business_name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  const category = $("regCategory").value;
  if(!business_name || !email || !password){
    showMsg($("authMsg"), "Fill in business name, email and password.", "error");
    return;
  }
  try{
    await api("/merchants/register", "POST", {business_name, email, password, category});
    // Registering doesn't itself start a session — log in right after.
    const merchant = await api("/auth/merchant-login", "POST", {email, password});
    state.merchant = merchant;
    enterDashboard();
  }catch(e){
    showMsg($("authMsg"), e.detail || "Could not register. Email may already be in use.", "error");
  }
}

async function logout(){
  try{ await api("/auth/merchant-logout", "POST"); }catch(e){ /* clearing local state regardless */ }
  state.merchant = null;
  $("dashScreen").classList.add("hidden");
  $("merchantBadge").textContent = "";
  $("authScreen").classList.remove("hidden");
  switchTab("login");
}

async function enterDashboard(){
  $("authScreen").classList.add("hidden");
  $("dashScreen").classList.remove("hidden");
  $("merchantBadge").textContent = state.merchant.business_name;
  renderProfile(state.merchant);
  await loadBalance();
  await loadTransactions();
}

function renderProfile(m){
  $("bizName").textContent = m.business_name;
  $("bizCategory").textContent = m.category.replace('_',' ');
  const statusClass = m.is_suspended ? "status-suspended" : `status-${m.status}`;
  const statusText = m.is_suspended ? "suspended" : m.status;
  $("bizStatus").className = `status-badge ${statusClass}`;
  $("bizStatus").textContent = statusText;
}

async function loadBalance(){
  const b = await api(`/merchants/${state.merchant.id}/balance`);
  $("balanceAmount").innerHTML = `${b.settled_balance.toLocaleString()}<span class="unit">SIM</span>`;
}

async function loadTransactions(){
  const txns = await api(`/payments/merchant/${state.merchant.id}`);
  const list = $("txnList");
  if(txns.length === 0){
    list.innerHTML = `<p class="empty-note">No transactions yet.</p>`;
    return;
  }
  list.innerHTML = txns.map(t => `
    <div class="ledger-row">
      <div>
        <div class="ledger-amount">${t.amount.toLocaleString()} SIM</div>
        <div class="mono" style="font-size:0.7rem;color:var(--text-muted);">${new Date(t.created_at).toLocaleString()}</div>
      </div>
      <span class="stamp ${stampClass(t.status)}">${t.status.replace(/_/g,' ')}</span>
    </div>
  `).join("");
}

function stampClass(status){
  if(status === "settled") return "stamp-settled";
  if(status.startsWith("rejected") || status.startsWith("failed")) return "stamp-rejected";
  if(status === "disputed") return "stamp-disputed";
  return "stamp-pending";
}
</script>

</body>
</html>
