<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10192B; --bg:#F6F7F9; --surface:#FFFFFF; --border:#E3E6EA; --muted:#5B6472;
    --brand:#0B6E4F; --brand-dark:#09593F; --brand-tint:#E6F2ED; --danger:#B3261E; --danger-tint:#FBEAE9;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;}
  h1,h2{font-family:'Space Grotesk',sans-serif; margin:0;}
  a{color:inherit;}

  header{background:var(--surface); border-bottom:1px solid var(--border); padding:1.1rem 1.25rem;}
  .brand{display:flex; align-items:center; gap:0.55rem; text-decoration:none;}
  .brand-mark{width:11px; height:11px; border-radius:3px; background:var(--brand); display:inline-block;}
  header h1{font-weight:700; font-size:1.25rem;}
  header p{color:var(--muted); font-size:0.85rem; margin:0.5rem 0 0;}

  main{max-width:480px; margin:0 auto; padding:1.25rem 1.25rem 3rem;}
  .hidden{display:none !important;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem;}

  .field{margin-top:0.9rem;}
  .field label{display:block; font-size:0.8rem; color:var(--muted); font-weight:500; margin-bottom:0.3rem;}
  input[type=text], select, textarea{
    width:100%; padding:0.65rem 0.75rem; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-family:'Inter'; font-size:0.95rem;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }

  .stars{display:flex; gap:0.4rem; margin-top:0.3rem;}
  .star{font-size:1.8rem; cursor:pointer; color:var(--border); background:none; border:none; padding:0; line-height:1; user-select:none;}
  .star.active{color:var(--brand);}
  .rating-label{font-size:0.78rem; color:var(--muted); margin-top:0.3rem; min-height:1em;}

  .check-row{display:flex; align-items:center; gap:0.5rem; margin-top:1rem;}
  .check-row label{margin:0; font-weight:400; font-size:0.88rem;}

  button.submit{
    width:100%; margin-top:1.3rem; padding:0.8rem; border:none; border-radius:8px;
    background:var(--brand); color:#fff; font-family:'Inter'; font-weight:600; font-size:0.95rem; cursor:pointer;
  }
  button.submit:hover{background:var(--brand-dark);}
  button.submit:disabled{background:var(--muted); cursor:not-allowed;}

  .msg{font-size:0.85rem; margin-top:0.7rem; padding:0.55rem 0.75rem; border-radius:8px;}
  .msg.error{background:var(--danger-tint); color:var(--danger); border:1px solid rgba(179,38,30,0.2);}

  .thanks{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:2rem 1.4rem; text-align:center;}
  .thanks .mark{width:44px; height:44px; border-radius:50%; background:var(--brand-tint); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700; margin:0 auto 0.9rem;}
  .thanks h2{margin-bottom:0.4rem; font-size:1.1rem;}
  .thanks p{color:var(--muted); font-size:0.9rem; margin:0 0 1.2rem;}
  .thanks button{
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    padding:0.6rem 1.1rem; border-radius:8px; font-family:'Inter'; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <a href="/" class="brand"><span class="brand-mark"></span><h1>Ledger — Feedback</h1></a>
  <p>Tried the app? Tell us what worked and what didn't — this goes straight to the dev team.</p>
</header>

<main>

  <section id="formCard" class="card">
    <h2 style="font-size:1.05rem; font-weight:600;">How was your walkthrough?</h2>

    <div class="field">
      <label for="fbName">Name (optional)</label>
      <input type="text" id="fbName" placeholder="so we know who to follow up with">
    </div>

    <div class="field">
      <label for="fbRole">Your role on this</label>
      <select id="fbRole">
        <option value="">Prefer not to say</option>
        <option value="developer">Developer</option>
        <option value="founder_stakeholder">Founder / stakeholder</option>
        <option value="merchant_side">Merchant-side tester</option>
        <option value="operations_support">Operations / support</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>Overall, how did it feel to use?</label>
      <div class="stars" id="starRow">
        <button type="button" class="star" data-value="1">&#9733;</button>
        <button type="button" class="star" data-value="2">&#9733;</button>
        <button type="button" class="star" data-value="3">&#9733;</button>
        <button type="button" class="star" data-value="4">&#9733;</button>
        <button type="button" class="star" data-value="5">&#9733;</button>
      </div>
      <div class="rating-label" id="ratingLabel"></div>
    </div>

    <div class="field">
      <label for="fbLiked">What worked well?</label>
      <textarea id="fbLiked" placeholder="e.g. the envelope idea was clear, purpose-mismatch rejection made sense"></textarea>
    </div>

    <div class="field">
      <label for="fbImprove">What should change or improve?</label>
      <textarea id="fbImprove" placeholder="e.g. confusing step, missing feature, something felt slow"></textarea>
    </div>

    <div class="check-row">
      <input type="checkbox" id="fbBug">
      <label for="fbBug">Something actually broke (bug, not just a suggestion)</label>
    </div>

    <div id="fbMsg"></div>
    <button class="submit" id="submitBtn" onclick="submitFeedback()">Send feedback</button>
  </section>

  <section id="thanksCard" class="thanks hidden">
    <div class="mark">&#10003;</div>
    <h2>Logged</h2>
    <p>Thanks — this feeds straight into the next build pass.</p>
    <button onclick="resetForm()">Submit another</button>
  </section>

</main>

<script>
let selectedRating = 0;
const labels = {1:"Rough", 2:"Needs work", 3:"Okay", 4:"Good", 5:"Really solid"};

document.querySelectorAll(".star").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedRating = parseInt(btn.dataset.value);
    document.querySelectorAll(".star").forEach(s => {
      s.classList.toggle("active", parseInt(s.dataset.value) <= selectedRating);
    });
    document.getElementById("ratingLabel").textContent = labels[selectedRating] || "";
  });
});

function showMsg(text){
  document.getElementById("fbMsg").innerHTML = `<div class="msg error">${text}</div>`;
}

async function submitFeedback(){
  if(selectedRating === 0){ showMsg("Tap a star to rate your experience."); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Sending…";

  const payload = {
    name: document.getElementById("fbName").value.trim() || null,
    role: document.getElementById("fbRole").value || null,
    rating: selectedRating,
    liked: document.getElementById("fbLiked").value.trim() || null,
    improve: document.getElementById("fbImprove").value.trim() || null,
    bug_report: document.getElementById("fbBug").checked,
  };

  try{
    const res = await fetch("/feedback", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
    if(!res.ok){ throw new Error(); }
    document.getElementById("formCard").classList.add("hidden");
    document.getElementById("thanksCard").classList.remove("hidden");
  }catch(e){
    showMsg("Could not send — check your connection and try again.");
    btn.disabled = false; btn.textContent = "Send feedback";
  }
}

function resetForm(){
  selectedRating = 0;
  document.querySelectorAll(".star").forEach(s => s.classList.remove("active"));
  document.getElementById("ratingLabel").textContent = "";
  document.getElementById("fbName").value = "";
  document.getElementById("fbRole").value = "";
  document.getElementById("fbLiked").value = "";
  document.getElementById("fbImprove").value = "";
  document.getElementById("fbBug").checked = false;
  document.getElementById("fbMsg").innerHTML = "";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "Send feedback";
  document.getElementById("thanksCard").classList.add("hidden");
  document.getElementById("formCard").classList.remove("hidden");
}
</script>

</body>
</html>
